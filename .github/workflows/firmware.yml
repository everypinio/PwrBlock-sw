name: Firmware

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker image
        run: docker build -t power_block-builder .

      - name: Build release presets
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e GITHUB_REF_NAME \
            -e GITHUB_REF_TYPE \
            -v "$PWD:/workspace" \
            -w /workspace \
            power_block-builder \
            bash -lc '
              set -euo pipefail

              rm -rf dist
              mkdir -p dist
              cmake_args=()

              if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
                cmake_args+=("-DFIRMWARE_VERSION=${GITHUB_REF_NAME#v}")
              fi

              for preset in release-tmc release-cdc; do
                rm -rf build
                cmake --preset "$preset" "${cmake_args[@]}"
                cmake --build --preset "$preset" --parallel

                for ext in elf hex bin map; do
                  if [ -f "build/power_block.$ext" ]; then
                    cp "build/power_block.$ext" "dist/power_block-${preset}.$ext"
                  fi
                done
              done

              cd dist
              sha256sum * > SHA256SUMS
            '

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: power_block-firmware
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: power_block-firmware
          path: dist

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            prerelease_args=()
            if [[ "$TAG_NAME" == *-* ]]; then
              prerelease_args+=(--prerelease)
            fi

            gh release create "$TAG_NAME" dist/* \
              --title "$TAG_NAME" \
              --generate-notes \
              "${prerelease_args[@]}"
          fi
